name: Android APK

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.30.5" "ndk;27.2.12479018"

      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Build llama.cpp
        env:
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          cmake -S llama.cpp -B llama-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DGGML_LTO=ON
          cmake --build llama-build --parallel

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Generate and sign release APK
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/llmapp-release.jks"
          PASS="$(openssl rand -hex 32)"
          APK="$(find app/build/outputs/apk -type f -name "*.apk" -print -quit)"
          test -n "$APK"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias llmapp \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LLMapp, OU=CI, O=LLMapp, C=BR"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          SIGNED="app/build/outputs/apk/release/app-release.apk"

          "$ZIPALIGN" -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias llmapp --out "$SIGNED" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" verify --verbose "$SIGNED"

          rm -f "$APK" "$RUNNER_TEMP/aligned.apk"
          echo "Signed APK: $SIGNED"
          ls -lh "$SIGNED"

      - uses: actions/upload-artifact@v4
        with:
          name: LLMapp-1.0.0
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
